# =====================================================================
#  Telegram File Uploader Bot - configurazione di esempio
#  Copia questo file in "config.yaml" e inserisci i tuoi dati.
#  NON committare mai config.yaml: contiene credenziali (è in .gitignore).
# =====================================================================

# --- Autenticazione ---------------------------------------------------
BOT_TOKEN: "123456789:ABCdefGHIjklMNOpQRsTUVWxyZ"  # Token del bot, da @BotFather
API_ID: "12345678"                                 # Da https://my.telegram.org -> API development tools
API_HASH: "abcdefgh1234567890abcdef123456789"      # Da https://my.telegram.org -> API development tools

# --- Destinazione -----------------------------------------------------
GROUP_LINK: -1001234567890  # ID numerico del gruppo/canale (i supergruppi/canali iniziano con -100)
REPLY_ID: null              # Opzionale: ID del messaggio/topic a cui rispondere (gruppi con thread). null = nessuno

# --- File -------------------------------------------------------------
FOLDERS:                    # Cartelle da scansionare (solo primo livello, non ricorsivo)
  - "path/to/video/folder"
  - "path/to/image/folder"
PROCESSED_FILES_PATH: "processed_files.txt"  # Registro dei file già caricati (uno per riga)

# --- Opzioni di caricamento -------------------------------------------
# Usa solo true o false (senza virgolette).
VIDEO_THUMBNAIL: true          # Estrae il frame centrale del video come thumbnail
SHOW_PROGRESS_BAR: true        # Mostra una barra di avanzamento (tqdm) durante l'upload
SUPPORT_VIDEO_STREAMING: true  # Marca i video come riproducibili in streaming
VIDEO_CAPTION: true            # Usa il nome del file (senza estensione) come didascalia dei video
IMAGE_CAPTION: false           # Usa il nome del file (senza estensione) come didascalia delle immagini
DELETE_AFTER_UPLOAD: false     # ATTENZIONE: se true elimina il file locale dopo un upload riuscito
